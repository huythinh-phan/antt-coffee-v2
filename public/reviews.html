<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Đánh Giá - ANTT Coffee</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
    <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">ANTT<small>Coffee</small></a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav">
                <span class="oi oi-menu"></span> Menu
            </button>
            <div class="collapse navbar-collapse" id="ftco-nav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="menu.html" class="nav-link">Menu</a></li>
                    <li class="nav-item"><a href="voucher.html" class="nav-link">Voucher</a></li>
                    <li id="cartNav" class="nav-item cart" style="display: none;">
                        <a href="cart.html" class="nav-link"><span class="icon icon-shopping_cart"></span><small id="cartCount">0</small></a>
                    </li>
                    <li id="loginContainer" class="nav-item"><a href="login.html" class="nav-link">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="home-slider owl-carousel" style="height: 400px;">
      <div class="slider-item" style="background-image: url(images/bg_3.jpg); height: 400px;" data-stellar-background-ratio="0.5">
        <div class="overlay"></div>
        <div class="container">
          <div class="row slider-text justify-content-center align-items-center" style="height: 400px;">
            <div class="col-md-7 col-sm-12 text-center ftco-animate">
                <h1 class="mb-3 mt-5 bread">Đánh Giá Đơn Hàng</h1>
                <p class="breadcrumbs"><span class="mr-2"><a href="history.html">Lịch sử</a></span> <span>Review</span></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="ftco-section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-8 ftco-animate">
            <form id="reviewForm" class="contact-form p-4" style="background: rgba(255,255,255,0.05);">
                <h3 class="mb-4 text-white text-center">Chia sẻ trải nghiệm của bạn</h3>
                
                <input type="hidden" id="orderId">

                <div class="form-group">
                        <label class="text-white">Món bạn thích nhất:</label>
                        <input type="text" id="dish_name" class="form-control" placeholder="VD: Cà phê sữa" style="background: rgba(0,0,0,0.2); color: white;">
                    </div>

                    <div class="form-group">
                        <label class="text-white">Thêm hình ảnh (tùy chọn):</label>
                        <input type="file" id="image" class="form-control-file text-white">
                    </div>

                    <div class="form-group">
                        <label class="text-white">Bạn cảm thấy thế nào?</label>
                        <select id="rating" class="form-control" style="background: rgba(0,0,0,0.2); color: #c49b63;">
                            <option value="5">⭐⭐⭐⭐⭐ - Tuyệt vời</option>
                            <option value="4">⭐⭐⭐⭐ - Hài lòng</option>
                            <option value="3">⭐⭐⭐ - Bình thường</option>
                            <option value="2">⭐⭐ - Tệ</option>
                            <option value="1">⭐ - Rất tệ</option>
                        </select>
                    </div>

                <div class="form-group">
                    <label class="text-white">Nội dung đánh giá:</label>
                    <textarea id="content" cols="30" rows="5" class="form-control" placeholder="Món ăn ngon, giao hàng nhanh..." required style="background: rgba(0,0,0,0.2); color: white;"></textarea>
                </div>

                <div class="form-group text-center">
                    <button type="submit" class="btn btn-primary py-3 px-5">Gửi Đánh Giá</button>
                </div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <script src="js/jquery.min.js"></script>
    <script src="js/jquery-migrate-3.0.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.easing.1.3.js"></script>
    <script src="js/jquery.waypoints.min.js"></script>
    <script src="js/jquery.stellar.min.js"></script>
    <script src="js/owl.carousel.min.js"></script>
    <script src="js/jquery.magnific-popup.min.js"></script>
    <script src="js/aos.js"></script>
    <script src="js/scrollax.min.js"></script>
    <script src="js/main.js"></script>
    
    <script src="js/api-client.js"></script>
    <script src="js/nav.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Lấy orderId từ URL (nếu có) để gắn vào form (tùy chọn)
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('orderId');
            if(orderId) document.getElementById('orderId').value = orderId;

            document.getElementById('reviewForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const user = JSON.parse(localStorage.getItem('currentUser'));
                
                if (!user || !user.Acc_id) { 
                    alert('Vui lòng đăng nhập lại!'); 
                    window.location.href = 'login.html';
                    return; 
                }

                const formData = new FormData();
                formData.append('acc_id', user.Acc_id);
                formData.append('rating', document.getElementById('rating').value);
                formData.append('content', document.getElementById('content').value);
                
                // Lấy tên món (nếu người dùng nhập, ko thì để mặc định)
                const dishName = document.getElementById('dish_name').value.trim();
                formData.append('dish_name', dishName || 'Đơn hàng #' + (orderId || ''));

                const fileInput = document.getElementById('image');
                if(fileInput.files[0]) {
                    formData.append('image', fileInput.files[0]);
                }

                try {
                    const res = await API.upload('/feedback', formData);

                    if (res.success) {
                        if (window.showToast) window.showToast('Cảm ơn phản hồi của bạn!');
                        else alert('Cảm ơn phản hồi của bạn!');
                        window.location.href = 'gallery.html';
                    } else {
                        alert(res.message || 'Lỗi gửi đánh giá');
                    }
                } catch(err) {
                    console.error(err);
                    alert('Lỗi kết nối server');
                }
            });
        });
    </script>
</body>
</html>
