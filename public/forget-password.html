<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Đăng Nhập - ANTT Coffee</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Josefin+Sans:400,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Great+Vibes" rel="stylesheet">
    <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/owl.theme.default.min.css">
    <link rel="stylesheet" href="css/magnific-popup.css">
    <link rel="stylesheet" href="css/aos.css">
    <link rel="stylesheet" href="css/ionicons.min.css">
    <link rel="stylesheet" href="css/bootstrap-datepicker.css">
    <link rel="stylesheet" href="css/jquery.timepicker.css">
    <link rel="stylesheet" href="css/flaticon.css">
    <link rel="stylesheet" href="css/icomoon.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">ANTT<small>Coffee</small></a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav">
                <span class="oi oi-menu"></span> Menu
            </button>
            <div class="collapse navbar-collapse" id="ftco-nav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="menu.html" class="nav-link">Menu</a></li>
                    <li class="nav-item"><a href="voucher.html" class="nav-link">Voucher</a></li>
                    <li id="cartNav" class="nav-item cart" style="display: none;">
                        <a href="cart.html" class="nav-link"><span class="icon icon-shopping_cart"></span><small id="cartCount">0</small></a>
                    </li>
                    
                </ul>
            </div>
        </div>
    </nav>
    <section class="ftco-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 text-center mb-5">
                    <h2 class="heading-section">Khôi Phục Mật Khẩu</h2>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="login-wrap p-0">
                        <form id="resetForm" class="signin-form">
                            <div class="form-group">
                                <input type="text" id="username" class="form-control" placeholder="Tên đăng nhập" required>
                            </div>
                            <div class="form-group">
                                <input type="email" id="email" class="form-control" placeholder="Email đăng ký" required>
                            </div>
                            <div class="form-group">
                                <input type="password" id="newPassword" class="form-control" placeholder="Mật khẩu mới" required>
                            </div>
                            <div class="form-group">
                                <button type="submit" class="btn btn-primary submit px-3 btn-block">Đổi Mật Khẩu</button>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <a href="login.html" class="btn btn-white btn-outline-white">Quay lại Đăng nhập</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <script src="js/api-client.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                newPassword: document.getElementById('newPassword').value
            };
            
            const res = await API.post('/reset-password', data);
            if(res.success) {
                alert(res.message);
                window.location.href = 'login.html';
            } else {
                alert(res.message);
            }
        });
    </script>
</body>
</html>
