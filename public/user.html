<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Thông Tin Cá Nhân - ANTT Coffee</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Josefin+Sans:400,700" rel="stylesheet">
    <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">ANTT<small>Coffee</small></a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav">
                <span class="oi oi-menu"></span> Menu
            </button>
            <div class="collapse navbar-collapse" id="ftco-nav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="menu.html" class="nav-link">Menu</a></li>
                    <li class="nav-item"><a href="voucher.html" class="nav-link">Voucher</a></li>
                    <li id="cartNav" class="nav-item cart" style="display: none;">
                        <a href="cart.html" class="nav-link"><span class="icon icon-shopping_cart"></span><small id="cartCount">0</small></a>
                    </li>
                    <li id="loginContainer" class="nav-item"><a href="login.html" class="nav-link">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="home-slider owl-carousel" style="height: 400px;">
      <div class="slider-item" style="background-image: url(images/bg_3.jpg); height: 400px;">
        <div class="overlay"></div>
        <div class="container">
          <div class="row slider-text justify-content-center align-items-center" style="height: 400px;">
            <div class="col-md-7 col-sm-12 text-center">
                <h1 class="mb-3 mt-5 bread">Hồ Sơ Của Tôi</h1>
                <p class="breadcrumbs"><span class="mr-2"><a href="index.html">Home</a></span> <span>Profile</span></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="ftco-section contact-section">
      <div class="container">
        <div class="row block-9">
          <div class="col-md-8 offset-md-2 contact-info">
            <div class="row">
                <div class="col-md-12 mb-4">
                    <h2 class="h4">Thông tin tài khoản</h2>
                </div>
            </div>
            <form id="profileForm" class="contact-form p-4" style="background: rgba(255,255,255,0.05);">
                <div class="form-group">
                    <label class="text-white">Họ và Tên</label>
                    <input type="text" id="fullname" class="form-control" required style="color: white !important;">
                </div>
                <div class="form-group">
                    <label class="text-white">Email</label>
                    <input type="email" id="email" class="form-control" readonly style="color: #ccc !important; background: rgba(0,0,0,0.2);">
                </div>
                <div class="form-group">
                    <label class="text-white">Số Điện Thoại</label>
                    <input type="text" id="phone" class="form-control" placeholder="Cập nhật để tích điểm" style="color: white !important;">
                </div>
                <div class="form-group">
                    <label class="text-white">Địa Chỉ Mặc Định</label>
                    <input type="text" id="address" class="form-control" placeholder="Số nhà, tên đường..." style="color: white !important;">
                </div>
                <div class="form-group">
                    <label class="text-white">Điểm Tích Lũy</label>
                    <input type="text" id="points" class="form-control" readonly style="color: #c49b63 !important; font-weight: bold; background: rgba(0,0,0,0.2);">
                </div>
                <div class="form-group text-center">
                    <button type="submit" class="btn btn-primary py-3 px-5">Cập Nhật Hồ Sơ</button>
                </div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <script src="js/jquery.min.js"></script>
    <script src="js/jquery-migrate-3.0.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.easing.1.3.js"></script>
    <script src="js/jquery.waypoints.min.js"></script>
    <script src="js/jquery.stellar.min.js"></script>
    <script src="js/owl.carousel.min.js"></script>
    <script src="js/main.js"></script>
    
    <script src="js/api-client.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/user.js"></script> 
</body>
</html>
