<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cart - ANTT Coffee</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Josefin+Sans:400,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Great+Vibes" rel="stylesheet">
    <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/owl.theme.default.min.css">
    <link rel="stylesheet" href="css/magnific-popup.css">
    <link rel="stylesheet" href="css/aos.css">
    <link rel="stylesheet" href="css/ionicons.min.css">
    <link rel="stylesheet" href="css/bootstrap-datepicker.css">
    <link rel="stylesheet" href="css/jquery.timepicker.css">
    <link rel="stylesheet" href="css/flaticon.css">
    <link rel="stylesheet" href="css/icomoon.css">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .table-cart {
            min-width: 1000px !important;
            width: 100%;
            background: rgba(255, 255, 255, 0.05); /* Nền mờ cho bảng */
        }
        .table-cart thead th {
            color: #fff;
            background: #c49b63;
            padding: 20px 10px;
            font-size: 16px;
        }
        .table-cart tr td {
            padding: 20px 10px;
            vertical-align: middle;
            color: #fff; /* Chữ màu trắng */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .table-cart .image-prod .img {
            display: block;
            width: 100px;
            height: 100px;
            margin: 0 auto;
            border-radius: 4px;
            background-size: cover;
            background-position: center center;
        }
        .table-cart .product-name h3 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 0;
        }
        .table-cart .price, .table-cart .total {
            color: #c49b63;
            color: #fff;
            font-weight: 500;
        }
        .btn-remove {
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px 10px;
            color: #fff;
            border-radius: 4px;
        }
        .btn-remove:hover {
            background: #c49b63;
            border-color: #c49b63;
            color: #fff;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">ANTT<small>Coffee</small></a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav">
                <span class="oi oi-menu"></span> Menu
            </button>
            <div class="collapse navbar-collapse" id="ftco-nav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="menu.html" class="nav-link">Menu</a></li>
                    <li class="nav-item"><a href="voucher.html" class="nav-link">Voucher</a></li>
                    <li class="nav-item cart active"><a href="cart.html" class="nav-link"><span class="icon icon-shopping_cart"></span><small id="cartCount">0</small></a></li>
                    <li id="loginContainer" class="nav-item"><a href="login.html" class="nav-link">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="home-slider owl-carousel">
      <div class="slider-item" style="background-image: url(images/bg_3.jpg);" data-stellar-background-ratio="0.5">
      	<div class="overlay"></div>
        <div class="container">
          <div class="row slider-text justify-content-center align-items-center">
            <div class="col-md-7 col-sm-12 text-center">
            	<h1 class="mb-3 mt-5 bread">Giỏ Hàng</h1>
	            <p class="breadcrumbs"><span class="mr-2"><a href="index.html">Home</a></span> <span>Cart</span></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="ftco-section ftco-cart">
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <div class="cart-list mb-5">
                        <table class="table table-cart">
                            <thead class="thead-primary">
                                <tr class="text-center">
                                    <th>&nbsp;</th>
                                    <th>Hình ảnh</th>
                                    <th>Tên sản phẩm</th>
                                    <th>Giá</th>
                                    <th>Số lượng</th>
                                    <th>Tổng</th>
                                </tr>
                            </thead>
                            <tbody id="cartItems">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="row d-flex justify-content-between">
                
                <div class="col-lg-7 col-md-6 cart-wrap">
                    <div class="cart-total mb-3 p-4 h-100" style="background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05);">
                        <h3 class="mb-4 billing-heading">Thông Tin Giao Hàng</h3>
                        <form id="shippingForm">
                            <div class="form-group">
                                <label class="text-white small">Họ tên người nhận</label>
                                <input type="text" id="shipName" class="form-control" placeholder="Nhập họ tên" required style="background: rgba(255,255,255,0.05); color: white;">
                            </div>
                            <div class="form-group">
                                <label class="text-white small">Số điện thoại</label>
                                <input type="text" id="shipPhone" class="form-control" placeholder="Nhập số điện thoại" required style="background: rgba(255,255,255,0.05); color: white;">
                            </div>
                            <div class="form-group">
                                <label class="text-white small">Địa chỉ nhận hàng</label>
                                <input type="text" id="shipAddress" class="form-control" placeholder="Nhập địa chỉ chi tiết" required style="background: rgba(255,255,255,0.05); color: white;">
                            </div>
                        </form>
                    </div>
                </div>

                <div class="col-lg-5 col-md-6 cart-wrap">
                    <div class="cart-total mb-3 p-4 h-100 d-flex flex-column justify-content-between" style="background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05);">
                        <div id="voucherSection">
                            <h3 class="mb-4 billing-heading">Tổng Giỏ Hàng</h3>
                            
                            <div class="form-group mb-3">
                                <label style="font-size: 13px; color: #ccc;">Mã ưu đãi của bạn:</label>
                                <select id="savedVouchersSelect" class="form-control" style="background: rgba(255,255,255,0.05) !important; color: #c49b63 !important; border: 1px solid rgba(255,255,255,0.1);">
                                    <option value="">-- Chọn mã --</option>
                                </select>
                            </div>

                            <div class="form-group d-flex mb-1">
                                <input type="text" id="voucherInput" class="form-control" placeholder="Nhập mã khác" style="background: rgba(255,255,255,0.05) !important; color: white !important; height: auto;">
                                <button type="button" onclick="applyVoucher()" class="btn btn-primary py-3 px-3 ml-2" style="color: #ffffff !important;">Áp dụng</button>
                            </div>
                            <p id="voucherMessage" class="text-danger mt-0 mb-3" style="font-size: 13px; min-height: 20px;"></p>
                            
                            <p class="d-flex justify-content-between">
                                <span>Tạm tính</span>
                                <span id="cartTotal" data-value="0">0 ₫</span>
                            </p>
                            <p class="d-flex justify-content-between">
                                <span>Giảm giá</span>
                                <span id="discountAmount">0 ₫</span>
                            </p>
                            <hr style="border-color: rgba(255,255,255,0.1);">
                            <p class="d-flex justify-content-between total-price">
                                <span>Thành tiền</span>
                                <span id="finalTotal" style="color: #c49b63; font-weight: bold;">0 ₫</span>
                            </p>
                        </div>
                        
                        <button onclick="processCheckout()" class="btn btn-primary py-3 px-4 w-100 mt-3 font-weight-bold" style="color: #ffffff !important;">Thanh Toán Ngay</button>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <footer class="ftco-footer ftco-section img">
        <div class="overlay"></div>
        <div class="container">
            <div class="row mb-5">
                <div class="col-md-12 text-center">
                    <p>Copyright &copy; All rights reserved | ANTT Coffee</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/jquery.min.js"></script>
    <script src="js/jquery-migrate-3.0.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.easing.1.3.js"></script>
    <script src="js/jquery.waypoints.min.js"></script>
    <script src="js/jquery.stellar.min.js"></script>
    <script src="js/owl.carousel.min.js"></script>
    <script src="js/jquery.magnific-popup.min.js"></script>
    <script src="js/aos.js"></script>
    <script src="js/jquery.animateNumber.min.js"></script>
    <script src="js/main.js"></script>
    
    <script src="js/api-client.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/cart.js"></script> 
</body>
</html>
